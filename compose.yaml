name: haven-key

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-8000}:80"
    environment:
      APP_NAME: "Haven & Key Property"
      APP_ENV: local
      APP_KEY: "${DOCKER_APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${DOCKER_APP_PORT:-8000}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DOCKER_DB_DATABASE:-haven_key}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-haven}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-haven_secret}"
      FILESYSTEM_DISK: public
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${DOCKER_DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-haven_key}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-haven}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-haven_secret}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DOCKER_DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  app_storage:
  mysql_data:
